<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00ff87" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c38" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0e1528" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRadar" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic Animation Keyframes */
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { r: 25px; opacity: 0.9; }
      50% { r: 120px; opacity: 0.2; }
      100% { r: 175px; opacity: 0; }
    }
    @keyframes pulseRing2 {
      0% { r: 40px; opacity: 0.8; }
      50% { r: 140px; opacity: 0.3; }
      100% { r: 195px; opacity: 0; }
    }
    @keyframes targetBlink {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px #00ff87); }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-14px) translateX(10px); }
    }
    @keyframes dataDash {
      to { stroke-dashoffset: -1000; }
    }

    .radar-beam {
      transform-origin: 1040px 210px;
      animation: radarSweep 7s linear infinite;
    }
    .pulse-wave-1 {
      animation: pulseRing 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
    .pulse-wave-2 {
      animation: pulseRing2 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 2s;
    }
    .node-target-1 {
      animation: targetBlink 3s ease-in-out infinite;
      transform-origin: 990px 140px;
    }
    .node-target-2 {
      animation: targetBlink 3.8s ease-in-out infinite 1.2s;
      transform-origin: 1090px 270px;
    }
    .node-target-3 {
      animation: targetBlink 2.5s ease-in-out infinite 0.7s;
      transform-origin: 950px 260px;
    }
    .orb-float {
      animation: floatOrb 6s ease-in-out infinite;
    }
    .grid-lines {
      stroke: #19264c;
      stroke-width: 1;
      opacity: 0.35;
    }
    .data-stream {
      stroke-dasharray: 8, 12;
      animation: dataDash 25s linear infinite;
    }
  </style>

  <!-- Deep Cybersecurity Cyber Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Isometric Grid Pattern -->
  <g class="grid-lines">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs in background -->
  <g class="orb-float" opacity="0.45">
    <circle cx="200" cy="100" r="160" fill="#0055ff" filter="url(#glowCyan)" opacity="0.18" />
    <circle cx="950" cy="300" r="180" fill="#00ff87" filter="url(#glowGreen)" opacity="0.12" />
  </g>

  <!-- Animated Recon Data Streams (Background layer behind text) -->
  <g opacity="0.25">
    <path class="data-stream" d="M -50 210 Q 300 280 600 160 T 1250 220" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="data-stream" d="M -50 140 Q 400 60 750 260 T 1250 120" fill="none" stroke="#00ff87" stroke-width="1.5" />
  </g>

  <!-- Radar Threat Reconnaissance Scope on Right Side -->
  <g id="radarGroup" transform="translate(0, 0)">
    <!-- Radar Concentric Rings -->
    <circle cx="1040" cy="210" r="45" fill="none" stroke="#1d3557" stroke-width="1.5" />
    <circle cx="1040" cy="210" r="95" fill="none" stroke="#1d3557" stroke-width="1.5" />
    <circle cx="1040" cy="210" r="145" fill="none" stroke="#1d3557" stroke-width="1.5" />
    <circle cx="1040" cy="210" r="180" fill="none" stroke="#2a4878" stroke-width="2" stroke-dasharray="6, 4" opacity="0.6" />

    <!-- Crosshairs -->
    <line x1="860" y1="210" x2="1220" y2="210" stroke="#1d3557" stroke-width="1.5" stroke-dasharray="4, 4" />
    <line x1="1040" y1="30" x2="1040" y2="390" stroke="#1d3557" stroke-width="1.5" stroke-dasharray="4, 4" />

    <!-- Dynamic Pulsing Radar Rings -->
    <circle class="pulse-wave-1" cx="1040" cy="210" r="25" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#glowCyan)" />
    <circle class="pulse-wave-2" cx="1040" cy="210" r="40" fill="none" stroke="#00ff87" stroke-width="1.5" filter="url(#glowGreen)" />

    <!-- Sweeping Radar Beam (Dynamic rotating cone) -->
    <g class="radar-beam">
      <path d="M 1040 210 L 1220 210 A 180 180 0 0 0 1195 105 Z" fill="url(#textGrad)" opacity="0.18" filter="url(#glowRadar)" />
      <line x1="1040" y1="210" x2="1220" y2="210" stroke="#00f2fe" stroke-width="2.5" filter="url(#glowCyan)" opacity="0.8" />
    </g>

    <!-- Radar Target Blips / Threat Nodes -->
    <g class="node-target-1">
      <circle cx="990" cy="140" r="5.5" fill="#ff4757" />
      <circle cx="990" cy="140" r="12" fill="none" stroke="#ff4757" stroke-width="1" opacity="0.7" />
      <text x="1004" y="145" fill="#ff6b81" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">THREAT_ACTOR [ONION]</text>
    </g>

    <g class="node-target-2">
      <circle cx="1090" cy="270" r="5" fill="#ffa502" />
      <circle cx="1090" cy="270" r="11" fill="none" stroke="#ffa502" stroke-width="1" opacity="0.7" />
      <text x="1010" y="295" fill="#eccc68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">STEALER_LOGS: EXPOSED</text>
    </g>

    <g class="node-target-3">
      <circle cx="950" cy="260" r="4.5" fill="#00ff87" />
      <circle cx="950" cy="260" r="10" fill="none" stroke="#00ff87" stroke-width="1" opacity="0.7" />
      <text x="860" y="278" fill="#7bed9f" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TOR_FORUM_GATEWAY</text>
    </g>

    <!-- Radar Center Pivot -->
    <circle cx="1040" cy="210" r="6" fill="#00f2fe" filter="url(#glowCyan)" />
  </g>

  <!-- FOREGROUND CONTENT: Strictly kept in foreground so dynamic elements never obscure it -->
  <g id="foregroundHeader" transform="translate(70, 0)">
    
    <!-- Status / Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="330" height="30" rx="15" fill="#131e3d" stroke="#253e77" stroke-width="1.5" />
      <circle cx="16" cy="15" r="5" fill="#00ff87" filter="url(#glowGreen)" />
      <text x="32" y="20" fill="#a4b3d6" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">CYBER THREAT RECONNAISSANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#textGrad)" font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" filter="url(#glowCyan)">
      Dark Web Monitoring
    </text>
    <text x="0" y="202" fill="#ffffff" font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      &amp; Threat Intelligence Recon
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="244" fill="#94a3b8" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="16.5" font-weight="400" letter-spacing="0.2">
      Curated Market Guide: Enterprise SaaS Platforms &amp; Self-Hosted Open-Source OSINT Tooling
    </text>

    <!-- Feature Feature Tag Badges -->
    <g transform="translate(0, 276)">
      <!-- Badge 1: Illicit Communities -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" width="4" height="34" rx="2" fill="#00f2fe" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">🕵️ Illicit Communities</text>
      </g>

      <!-- Badge 2: Credential Exposure -->
      <g transform="translate(195, 0)">
        <rect width="175" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" width="4" height="34" rx="2" fill="#38ef7d" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">🔑 Credential Breaches</text>
      </g>

      <!-- Badge 3: Tor & Stealer Logs -->
      <g transform="translate(385, 0)">
        <rect width="170" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" width="4" height="34" rx="2" fill="#a855f7" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">🧅 Tor &amp; Stealer Logs</text>
      </g>

      <!-- Badge 4: MITRE / STIX / MISP -->
      <g transform="translate(570, 0)">
        <rect width="145" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" width="4" height="34" rx="2" fill="#f59e0b" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">⚡ STIX &amp; MISP OSINT</text>
      </g>
    </g>

    <!-- Metrics Meta Bar -->
    <g transform="translate(0, 335)">
      <text x="0" y="16" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500">
        Transparent Pricing • Valuation &amp; Revenue Benchmarks • Open-Source Stargazer Rankings
      </text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#253556" stroke-width="1.5" />
</svg>